# Configuration du site Jekyll
title: "Week-end Annecy 2025"
description: "Guide pratique pour notre week-end entre amis au lac d'Annecy"
url: "https://ton-username.github.io"
baseurl: "/weekend-annecy"

# Configuration Jekyll
markdown: kramdown
highlighter: rouge
theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Navigation principale
header_pages:
  - pages/transport.md
  - pages/hebergement.md
  - pages/valise.md
  - pages/activites.md

# Configuration des collections
collections:
  pages:
    output: true
    permalink: /:name/

# Paramètres du site
author: "Organisateur du week-end"
email: "ton-email@example.com"

# Réseaux sociaux (optionnel)
github_username: ton-username

# Configuration des permaliens
permalink: /:title/

# Exclusions
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor